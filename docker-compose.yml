version: '3.8'

services:
  pricing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricing-engine
    image: pricing-engine:latest
    environment:
      JAVA_OPTS: "-Xmx256m -Xms128m"
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional: Testing container
  pricing-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: pricing-tests
    depends_on:
      pricing-engine:
        condition: service_healthy
    environment:
      TEST_TIMEOUT: "60"
    volumes:
      - ./test-results:/app/test-results
